<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>
<body>

    <center>
        <h1>Library Management System</h1>
        <hr>

        <h2>Add Book</h2>
        <form>
            Book ID: <input type="text"><br><br>
            Book Name: <input type="text"><br><br>
            Author: <input type="text"><br><br>
            <input type="submit" value="Add Book">
        </form>

        <hr>

        <h2>Search Book</h2>
        <input type="text" placeholder="Enter Book Name">
        <input type="submit" value="Search">

        <hr>

        <h2>Issue Book</h2>
        <form>
            Student Name: <input type="text"><br><br>
            Book Name: <input type="text"><br><br>
            Issue Date: <input type="date"><br><br>
            <input type="submit" value="Issue Book">
        </form>

        <hr>

        <h2>Return Book</h2>
        <form>
            Book ID: <input type="text"><br><br>
            Return Date: <input type="date"><br><br>
            <input type="submit" value="Return Book">
        </form>

        <hr>

        <h2>Available Books</h2>
        <table border="1" cellpadding="10">
            <tr>
                <th>Book ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>101</td>
                <td>HTML Basics</td>
                <td>John</td>
                <td>Available</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Java Programming</td>
                <td>James</td>
                <td>Issued</td>
            </tr>
        </table>
    </center>

</body>
</html>
